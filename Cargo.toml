[package]
name = "aidawarp"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
# Scratch network and archive work is isolated in aida-project.
aida-project = { path = "aida-project" }

[build-dependencies]
tauri-build = { version = "2" }

[workspace]
members = ["aida-ast", "aida-project", "aida-runtime"]
resolver = "3"
