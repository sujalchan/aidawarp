[package]
name = "aidawarp"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2" }

[workspace]
members = ["aida-ast", "aida-runtime"]
resolver = "3"
